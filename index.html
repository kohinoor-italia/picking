<!DOCTYPE html>
<html lang="it">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5fff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<title>Inventario Magazzino</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>

<style>
:root{
  --bg:#f1f4f9; --card:#ffffff; --ink:#1b2430; --muted:#6b7686;
  --brand:#0b5fff; --brand-d:#0846c2; --line:#dde3ec; --ok:#12805c; --warn:#b26a00;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
button{font-family:inherit;font-size:inherit;cursor:pointer}

.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;padding:10px 12px 12px;padding-top:calc(10px + env(safe-area-inset-top))}

.top-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.title{font-size:18px;font-weight:700}
.upd{font-size:12px;opacity:.9;margin-top:2px}
.btn-up{background:#fff;color:var(--brand);border:0;border-radius:10px;padding:10px 12px;font-weight:700;min-height:44px}
.search-wrap{position:relative;max-width:900px;margin:0 auto}
.search{width:100%;height:50px;border:0;border-radius:12px;padding:0 44px 0 14px;font-size:18px;outline:none}
.clear{position:absolute;right:4px;top:4px;width:42px;height:42px;border:0;background:transparent;font-size:22px;color:var(--muted);display:none}
.sugg{position:absolute;left:0;right:0;top:56px;background:#fff;color:var(--ink);border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,.25);max-height:60vh;overflow:auto;display:none}
.sg-h{padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted);background:#f6f8fb;text-transform:uppercase;letter-spacing:.5px}
.sg{display:block;width:100%;text-align:left;background:#fff;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:52px}
.sg:active,.sg:hover{background:#eaf1ff}
.sg b{display:block;font-size:16px}
.sg span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.sg .loc-art b{display:inline;font-size:13px;color:var(--ink)}
.sg-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sg .tag{display:inline-block;margin:0;padding:3px 9px;font-size:12px;color:var(--ok);flex-shrink:0}
.sg .tag.empty{color:var(--muted)}



.wrap{max-width:1200px;margin:0 auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr;gap:12px}
.panel{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);overflow:hidden}
.ph{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph small{color:var(--muted);font-weight:400}
.list{max-height:none}
.loc-row{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;border:0;border-bottom:1px solid var(--line);background:#fff;padding:0 14px;min-height:54px;text-align:left}
.loc-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.loc-code{flex-shrink:0}
.loc-art{display:block;flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s ease;opacity:1}
.loc-art b{color:var(--ink)}
.loc-art.fade{opacity:0}
.loc-row .tag{flex-shrink:0}


.loc-row:active,.loc-row:hover{background:#eaf1ff}
.loc-row.active{background:#dce8ff}
.loc-code{font-weight:700;font-size:17px;letter-spacing:.3px}
.tag{font-size:13px;border-radius:999px;padding:4px 10px;background:#e7f6ef;color:var(--ok)}
.tag.empty{background:#f1f1f1;color:var(--muted)}
.more{display:block;width:100%;border:0;background:#f6f8fb;color:var(--brand);font-weight:700;padding:16px}
.letter-sep{display:flex;align-items:center;gap:10px;padding:14px 14px 8px;background:#f6f8fb;border-bottom:1px solid var(--line)}
.letter-badge{display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:10px;background:var(--brand);color:#fff;font-weight:700;font-size:18px;flex-shrink:0}
.letter-line{flex:1;height:2px;background:linear-gradient(to right,var(--brand),transparent);border-radius:2px;opacity:.35}
.letter-cnt{font-size:12px;color:var(--muted);flex-shrink:0}
.grp-sep{display:flex;align-items:center;gap:8px;padding:5px 14px;background:#f6f8fb;border-bottom:1px solid var(--line)}
.grp-name{font-size:12px;font-weight:700;color:#fff;background:var(--brand);border-radius:6px;padding:2px 8px;letter-spacing:.5px;flex-shrink:0}
.grp-line{flex:1;height:0;border-top:1px solid var(--line)}
.grp-cnt{font-size:11px;color:var(--muted);flex-shrink:0}
.fab{position:fixed;right:16px;bottom:16px;z-index:70;width:54px;height:54px;border:0;border-radius:50%;background:var(--brand);color:#fff;font-size:26px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.fab:active{background:var(--brand-d);transform:scale(.94)}
body.selmode .fab{bottom:78px}



.back{display:inline-block;border:0;background:#eaf1ff;color:var(--brand);font-weight:700;border-radius:10px;padding:10px 14px;min-height:44px;margin:12px 14px 0}
.big-loc{font-size:30px;font-weight:700;color:var(--brand);padding:12px 14px 0;word-break:break-all}
.sub{padding:2px 14px 12px;color:var(--muted)}
.loc-head{display:flex;align-items:center;gap:10px;padding:10px 12px;background:#f6f8fb;border-bottom:1px solid var(--line)}
.loc-head .back{width:40px;height:40px;min-height:0;padding:0;margin:0;border-radius:50%;font-size:28px;line-height:36px;text-align:center;flex-shrink:0}
.loc-head .loc-title{flex:1;min-width:0}
.loc-head .big-loc{font-size:24px;line-height:1.1;padding:0}
.loc-head .sub{padding:2px 0 0;font-size:13px}
.excl-btn{width:40px;height:40px;border:0;border-radius:50%;background:#fde8ea;font-size:18px;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:0}
.excl-btn:active{background:#f9cfd4}

table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:8px 14px;background:#f6f8fb}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:top}
tr.clickable{cursor:pointer}
tr.clickable:hover{background:#eaf1ff}
td.code{font-weight:700;white-space:nowrap}
.art-card{padding:12px 14px;border-top:1px solid var(--line)}
.art-card h3{margin:0 0 2px;font-size:20px}
.art-card p{margin:0 0 10px;color:var(--muted)}
.loc-btn{display:inline-block;border:0;background:var(--brand);color:#fff;border-radius:12px;padding:12px 16px;margin:0 8px 8px 0;min-height:48px;font-size:20px;font-weight:700}
.loc-btn:active{background:var(--brand-d)}
.loc-btn small{display:block;font-size:12px;font-weight:400;opacity:.9}
.placeholder{padding:40px 20px;text-align:center;color:var(--muted)}
.msg{padding:30px 16px;text-align:center;color:var(--muted)}

.status{position:fixed;left:0;right:0;bottom:0;background:#1b2430;color:#fff;padding:10px 14px;font-size:14px;display:none;z-index:50}
.status.err{background:#b00020}
.bar{height:6px;background:#3a4656;border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#4cd49a}

.filters{display:flex;flex-wrap:nowrap;gap:5px;padding:6px 10px;border-bottom:1px solid var(--line);background:#f6f8fb;overflow-x:auto}
.chip{flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:4px 10px;min-height:30px;font-size:13px;font-weight:700}

.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.ph-t{display:flex;flex-direction:column;min-width:0}
.ph-t b{font-size:16px;line-height:1.2}
.ph-t small{display:block;font-size:12px;margin-top:2px}
#selBtn{background:#eaf1ff;color:var(--brand);border-color:#eaf1ff;min-height:34px;padding:6px 12px;font-size:14px}
#selBtn.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.filters{justify-content:space-between;align-items:center;overflow:visible;padding:8px 10px}
.seg{display:flex;gap:2px;background:#e6ebf3;border-radius:10px;padding:3px;flex-shrink:0}
.seg .chip{border:0;background:transparent;color:var(--muted);border-radius:8px;min-height:30px;padding:4px 12px}
.seg .chip.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.filters{flex-wrap:wrap;row-gap:6px}
.lvl{border:0;background:transparent;color:var(--brand);font-weight:700;font-size:13px;min-height:30px;padding:0 8px;outline:none;font-family:inherit}
.ic{width:1.2em;height:1.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;display:inline-block;vertical-align:-.2em}
.btn-up{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-up .ic{width:20px;height:20px}
.clear .ic{width:20px;height:20px;vertical-align:middle}
.mx{display:flex;align-items:center;justify-content:center}
.mx .ic{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.chip .ic{width:16px;height:16px;vertical-align:middle}
.seg .chip .ic{width:17px;height:17px}
.selbar button{display:inline-flex;align-items:center;justify-content:center;gap:6px}
.selbar button .ic{width:18px;height:18px}
.fab .ic{width:26px;height:26px;stroke-width:2.4}
.lfbox{position:relative}
.lfbox .ic{position:absolute;left:11px;top:50%;margin-top:-9px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.lfbox .lf{padding-left:36px}
.back .ic{width:18px;height:18px;vertical-align:-4px;margin-right:2px}
.loc-head .back{display:flex;align-items:center;justify-content:center}
.loc-head .back .ic{width:22px;height:22px;margin:0;vertical-align:middle}
.excl-btn{color:#b00020}
.excl-btn .ic{width:20px;height:20px}
.ck{display:inline-flex;vertical-align:middle;margin-right:8px;color:var(--muted)}
.ck.on{color:#b00020}
.ck .ic{width:22px;height:22px;vertical-align:middle}
.ex-row .ic{width:14px;height:14px;vertical-align:-2px;margin:0 2px;color:var(--muted)}
.top-row{margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand-ic{width:38px;height:38px;border-radius:11px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.brand-ic .ic{width:22px;height:22px;color:#fff}
.brand .title{font-size:17px;line-height:1.15}
.brand .upd{display:flex;align-items:center;gap:4px;font-size:11.5px;opacity:.85;margin-top:2px;white-space:nowrap}
.brand .upd .ic{width:12px;height:12px}
.hbtns{display:flex;gap:8px;flex-shrink:0}
.hbtn{width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.18);color:#fff;display:flex;align-items:center;justify-content:center;padding:0}
.hbtn:active{background:rgba(255,255,255,.3)}
.hbtn .ic{width:20px;height:20px}
.hbtn.solid{background:#fff;color:var(--brand)}
.hbtn.solid:active{background:#eaf1ff}
.search-wrap .search{height:50px;border-radius:14px;padding:0 50px 0 44px;font-size:17px;background:#fff;color:var(--ink);box-shadow:0 2px 8px rgba(0,0,0,.15);transition:box-shadow .2s}
.search-wrap .search:focus{box-shadow:0 0 0 3px rgba(255,255,255,.55),0 2px 10px rgba(0,0,0,.2)}
.search-wrap .search::placeholder{color:#8a94a3}
.search-ic{position:absolute;left:14px;top:50%;margin-top:-10px;width:20px;height:20px;color:var(--brand);pointer-events:none}
.search-wrap .clear{right:7px;top:7px;width:34px;height:34px;border-radius:50%;background:#eef1f6;color:var(--muted);padding:0}
.search-wrap .clear:active{background:#dde3ec}
.search-wrap .clear .ic{display:block;margin:auto;width:16px;height:16px;stroke-width:2.4}
.sugg{top:56px}
.sg{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:0}
.sg .sg-ico{display:none}
.sg .sg-body{flex:1;min-width:0;margin:0}
.sg .sg-body > b{display:block;font-size:15px;line-height:1.2}
.sg .sg-body .loc-art{margin-top:1px;font-size:12px}
.sg .sg-body.row{display:flex;align-items:baseline;gap:8px}
.sg .sg-body.row > b{flex-shrink:0}
.sg .sg-desc{display:block;flex:1;min-width:0;margin:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg .tag{padding:2px 8px;font-size:11px}
.sg .tag.loc{background:#eaf1ff;color:var(--brand);font-weight:700}
.sg-h{padding:5px 12px;font-size:10px}





.lfwrap{padding:6px 10px 0;background:#f6f8fb}
.lf{display:block;width:100%;height:36px;border:1px solid var(--line);border-radius:10px;padding:0 10px;font-size:15px;outline:none;background:#fff}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:12px;overflow:auto}
.modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:100%;max-width:480px;overflow:hidden}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line)}
.mx{border:0;background:transparent;font-size:26px;color:var(--muted)}
.mb{padding:12px 14px;display:grid;gap:8px}
.ex-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.ex-row button{border:0;background:#fde8ea;color:#b00020;border-radius:8px;padding:6px 10px;font-weight:700}

.selbar{position:fixed;left:0;right:0;bottom:0;z-index:55;background:#1b2430;color:#fff;padding:10px 12px;display:none;align-items:center;gap:8px}
.selbar.on{display:flex}
.selbar span{flex:1;font-weight:700}
.selbar button{border:0;border-radius:10px;padding:10px 12px;min-height:42px;font-weight:700;background:#fff;color:#1b2430}
.selbar button.go{background:#b00020;color:#fff}
.loc-row.sel{background:#fde8ea}
body.selmode .wrap{padding-bottom:90px}

/* mobile: lista sau rezultat */




body.showing #listPanel{display:none}
body:not(.showing) #resultPanel{display:none}

@media (min-width:900px){
  .wrap{padding:18px}
  .grid{grid-template-columns:380px 1fr;gap:18px;align-items:start}
  body.showing #listPanel,body:not(.showing) #resultPanel{display:block}
  .back{display:none}
  .list{max-height:calc(100vh - 200px);overflow:auto}
  .top{padding:12px 24px 14px}
  .title{font-size:22px}
  .loc-row{min-height:46px}
}


/* ================= DESKTOP REDESIGN (>=900px) ================= */
@media (min-width:900px){
  body{
    font-family:"Inter","Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    background:
      radial-gradient(1200px 500px at 10% -10%, #dfe9ff 0%, transparent 60%),
      radial-gradient(900px 500px at 100% 0%, #e8f3ff 0%, transparent 55%),
      var(--bg);
    background-attachment:fixed;
  }

  /* ---- header: logo | căutare | butoane, pe un singur rând ---- */
  .top{
    display:flex;align-items:center;gap:32px;
    padding:14px max(28px, calc((100vw - 1400px)/2));
    background:linear-gradient(135deg,#0b5fff 0%,#0846c2 100%);
    box-shadow:0 6px 24px rgba(11,95,255,.28);
  }
  .top-row{display:contents}
  .brand{order:0}
  .search-wrap{order:1;flex:1;max-width:720px;margin:0 auto}
  .hbtns{order:2}
  .brand-ic{width:44px;height:44px;border-radius:13px}
  .brand .title{font-size:20px;letter-spacing:.2px}
  .brand .upd{font-size:12px}
  .hbtn{width:44px;height:44px;transition:transform .15s, background .15s}
  .hbtn:hover{transform:translateY(-1px);background:rgba(255,255,255,.32)}
  .hbtn.solid:hover{background:#eaf1ff}
  .search-wrap .search{height:54px;font-size:17px;border-radius:16px;box-shadow:0 4px 16px rgba(0,0,0,.18)}
  .sugg{top:62px;border-radius:16px;max-height:70vh;box-shadow:0 20px 50px rgba(10,30,80,.35)}
  .sg{padding:9px 16px;transition:background .12s}
  .sg .sg-body > b{font-size:16px}

  /* ---- layout ---- */
  .wrap{max-width:1400px;padding:24px 28px}
  .grid{grid-template-columns:440px 1fr;gap:24px}
  .panel{
    border-radius:20px;border:1px solid rgba(221,227,236,.8);
    box-shadow:0 2px 6px rgba(20,40,90,.05),0 14px 40px rgba(20,40,90,.08);
  }

  /* ---- lista (stânga): înălțime fixă, scroll intern ---- */
  body.showing #listPanel,body:not(.showing) #listPanel{
    display:flex;flex-direction:column;
    position:sticky;top:96px;height:calc(100vh - 124px);
  }
  .list{flex:1;max-height:none;overflow:auto}
  .ph{padding:16px 18px;background:linear-gradient(#fff,#fafbfe)}
  .ph-t b{font-size:17px}
  .lfwrap{padding:10px 14px 0}
  .lf{height:40px;border-radius:12px;transition:border-color .15s, box-shadow .15s}
  .lf:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(11,95,255,.15)}
  .filters{padding:10px 14px}
  .chip{transition:background .15s, color .15s, box-shadow .15s}
  .chip:not(.on):hover{background:#eef3fc}
  .seg .chip:not(.on):hover{background:rgba(255,255,255,.7)}
  #pdfBtn:hover,#selBtn:not(.on):hover{background:#dbe8ff !important}

  .loc-row{min-height:50px;padding:0 18px;transition:background .12s, box-shadow .12s}
  .loc-row:hover{background:#f0f5ff;box-shadow:inset 3px 0 0 #9bbcff}
  .loc-row.active{background:#e3edff;box-shadow:inset 4px 0 0 var(--brand)}
  .loc-row.sel{box-shadow:inset 4px 0 0 #b00020}
  .loc-code{font-size:16px;font-variant-numeric:tabular-nums}
  .grp-sep{padding:7px 18px;position:sticky;top:0;z-index:2}
  .more{padding:18px;transition:background .15s}
  .more:hover{background:#eaf1ff}

  /* ---- rezultat (dreapta) ---- */
  body.showing #resultPanel,body:not(.showing) #resultPanel{
    display:block;position:sticky;top:96px;
    height:calc(100vh - 124px);overflow:auto;
  }
  .placeholder{
    height:100%;min-height:360px;display:flex;align-items:center;justify-content:center;
    font-size:17px;padding:40px;
    background:
      radial-gradient(circle at 50% 40%, #eef4ff 0, transparent 55%);
  }
  .loc-head{padding:22px 28px;background:linear-gradient(135deg,#f3f7ff,#ffffff);border-bottom:1px solid var(--line)}
  .loc-head .back{display:none}
  .loc-head .big-loc{
    font-size:38px;font-weight:800;letter-spacing:.5px;
    background:linear-gradient(135deg,#0b5fff,#0846c2);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .loc-head .sub{font-size:15px;margin-top:4px}
  .excl-btn{width:44px;height:44px;transition:background .15s, transform .15s}
  .excl-btn:hover{background:#f9cfd4;transform:scale(1.06)}

  table{border-collapse:separate;border-spacing:0}
  th{position:sticky;top:0;z-index:1;padding:12px 28px;font-size:12px;background:#f3f6fb;border-bottom:1px solid var(--line)}
  td{padding:16px 28px;font-size:15px;border-top:0;border-bottom:1px solid #eef1f6}
  td.code{color:var(--brand);font-variant-numeric:tabular-nums;width:220px}
  tbody tr:nth-child(even){background:#fafbfe}
  tr.clickable{transition:background .12s}
  tr.clickable:hover{background:#e9f1ff}

  .art-card{padding:26px 28px}
  .art-card h3{font-size:28px;color:var(--brand)}
  .art-card p{font-size:16px}
  .loc-btn{border-radius:14px;padding:14px 20px;box-shadow:0 4px 12px rgba(11,95,255,.25);transition:transform .15s, box-shadow .15s}
  .loc-btn:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(11,95,255,.35)}

  /* ---- bară selecție / status / FAB: plutitoare, centrate ---- */
  .selbar{
    left:50%;right:auto;transform:translateX(-50%);

<script>
var SB_URL = "https://fndjrfieitieqzafhyzz.supabase.co";
var SB_KEY = "sb_publishable_bHDKjiKAVHqW199ICw7i2g_O3olYMAr";
var TABLE = "articoli";
var sb = supabase.createClient(SB_URL, SB_KEY);

var DB = { locs: [], locMap: new Map(), artMap: new Map(), artList: [], last: null };
var shown = 200;
var activeLoc = null;
var sugg = [];

function $(id){ return document.getElementById(id); }

var IC = {
  ban: '<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  chevL: '<path d="M15 5l-7 7 7 7"/>',
  pin: '<path d="M12 21s-6-5.5-6-10a6 6 0 0112 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2.2"/>',
  box: '<path d="M21 8l-9-5-9 5v8l9 5 9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/>',
  arrowR: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  selOff: '<rect x="3.5" y="3.5" width="17" height="17" rx="4.5"/>',
  selOn: '<rect x="3.5" y="3.5" width="17" height="17" rx="4.5" style="fill:currentColor"/><path d="M8 12.5l3 3 5-6" stroke="#fff"/>'
};
function ic(n){ return '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + IC[n] + '</svg>'; }
function ckHtml(on){ return '<span class="ck' + (on ? ' on' : '') + '">' + ic(on ? "selOn" : "selOff") + '</span>'; }
function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function noDots(s){ return String(s).toLowerCase().replace(/[\s.]/g,""); }
function natCmp(a,b){ return a.localeCompare(b, "it", { numeric: true }); }

/* ---------- status bar ---------- */
function setStatus(txt, pct, isErr){
  var s = $("status");
  if (!txt){ s.style.display = "none"; return; }
  s.style.display = "block";
  s.className = "status" + (isErr ? " err" : "");
  $("statusTxt").textContent = txt;
  $("barFill").style.width = (pct || 0) + "%";
}

/* ---------- load data ---------- */
async function loadAll(){
  var all = [], from = 0, step = 1000;
  while (true){
    var r = await sb.from(TABLE)
      .select("cod_magazzino,ubicazione,articolo,descrizione,uploaded_at")
      .order("id", { ascending: true })
      .range(from, from + step - 1);
    if (r.error) throw r.error;
    all = all.concat(r.data);
    if (r.data.length < step) break;
    from += step;
  }
  return all;
}

function buildIndex(rows){
  RAW = rows;
  BUSY = {};
  rows.forEach(function(r){ if (r.articolo) BUSY[r.ubicazione] = 1; });
  rows = rows.filter(function(r){ return BUSY[r.ubicazione] || !isExcluded(r.ubicazione); });
  window.HID = RAW.length - rows.length;


  var locMap = new Map(), artMap = new Map(), last = null;

  rows.forEach(function(r){
    if (!locMap.has(r.ubicazione)) locMap.set(r.ubicazione, []);
    if (r.articolo){
      locMap.get(r.ubicazione).push(r);
      if (!artMap.has(r.articolo)) artMap.set(r.articolo, []);
      artMap.get(r.articolo).push(r);
    }
    if (r.uploaded_at && (!last || r.uploaded_at > last)) last = r.uploaded_at;
  });
  DB.locMap = locMap;
  DB.artMap = artMap;
  locMap.forEach(function(arr){
    arr.sort(function(a, b){
      return natCmp(a.articolo || "", b.articolo || "");
    });
  });
  DB.locs = Array.from(locMap.keys()).sort(natCmp);

  DB.artList = Array.from(artMap.keys()).map(function(code){
    return { code: code, desc: artMap.get(code)[0].descrizione || "" };
  });
  DB.last = last;
}

function fmtDate(iso){
  if (!iso) return "Nessun aggiornamento";
  var d = new Date(iso);
  return "Aggiornato " + d.toLocaleDateString("it-IT") + " " +

    d.toLocaleTimeString("it-IT", { hour: "2-digit", minute: "2-digit" });
}



async function init(){
  try {
    await loadExc();
    var rows = await loadAll();

    buildIndex(rows);
    $("updTxt").textContent = fmtDate(DB.last);
    renderList();
  } catch (e){
    $("updTxt").textContent = "Eroare la incarcare";
    $("list").innerHTML = '<div class="msg">Nu s-au putut incarca datele.<br>' + esc(e.message || e) + '</div>';
  }
}

/* ---------- home list ---------- */
function artHtml(r){
  return '<b>' + esc(r.articolo) + '</b> ' + esc(r.descrizione || "");
}

var fMode = "all";
var fSort = "asc";
var fPar = "all";
var fLvl = "all";
var lvlKey = "";

function fillLevels(){
  var set = {};
  DB.locs.forEach(function(l){
    var v = l.split(".")[3];
    if (v && /^0[1-7]$/.test(v)) set[v] = 1;
  });
  var arr = Object.keys(set).sort(natCmp);
  var key = arr.join("|");
  if (key === lvlKey) return;
  lvlKey = key;
  var h = '<option value="all">Tutti i livelli</option>';
  arr.forEach(function(v){ h += '<option value="' + esc(v) + '">Livello ' + esc(v) + '</option>'; });
  $("lvl").innerHTML = h;
  if (fLvl !== "all" && !set[fLvl]) fLvl = "all";
  $("lvl").value = fLvl;
}

$("lvl").addEventListener("change", function(){
  fLvl = this.value;
  shown = 200;
  renderList();
});


function getFiltered(){
  var arr = DB.locs.filter(function(loc){
    var cnt = DB.locMap.get(loc).length;
    if (fMode === "free") return cnt === 0;
    if (fMode === "busy") return cnt > 0;
    return true;
  });
  if (fPar !== "all"){
    arr = arr.filter(function(loc){
      var n = parseInt(loc.split(".")[2], 10);
      if (isNaN(n)) return false;
      return fPar === "even" ? n % 2 === 0 : n % 2 !== 0;
    });
  }
  if (fLvl !== "all"){
    arr = arr.filter(function(loc){
      var v = loc.split(".")[3];
      return v && v.toUpperCase() === fLvl;
    });
  }
  var qv = noDots($("lq").value);
  if (qv){
    arr = arr.filter(function(loc){ return noDots(loc).indexOf(qv) === 0; });

  }
  if (fSort === "desc") arr.reverse();

  return arr;
}

function renderList(){
  fillLevels();
  var list = getFiltered();
  var total = list.length;
  $("listCount").textContent = total + " ubicazioni · " + (window.HID || 0) + " righe nascoste";



  var chips = document.querySelectorAll("#filters .chip");
  for (var c = 0; c < chips.length; c++){
    var m = chips[c].getAttribute("data-mode");
    var s = chips[c].getAttribute("data-sort");
    var p = chips[c].getAttribute("data-par");
    chips[c].classList.toggle("on", m ? m === fMode : (s ? s === fSort : p === fPar));

  }

  if (!DB.locs.length){
    $("list").innerHTML = '<div class="msg">Il database e vuoto.<br>Carica un file Excel.</div>';
    return;
  }
  if (!total){
    $("list").innerHTML = '<div class="msg">Nessuna ubicazione trovata.</div>';
    return;
  }
  var html = "";
  var n = Math.min(shown, total);
  function grpOf(l){ return l.split(".").slice(0, 2).join(".").toUpperCase(); }
  var cntG = {};
  list.forEach(function(l){
    var g = grpOf(l);
    cntG[g] = (cntG[g] || 0) + 1;
  });
  var lastG = "";
  for (var i = 0; i < n; i++){
    var loc = list[i];
    var G = grpOf(loc);
    if (G !== lastG){

      lastG = G;
      html += '<div class="grp-sep"><span class="grp-name">' + esc(G) + '</span><span class="grp-line"></span><span class="grp-cnt">' + cntG[G] + '</span></div>';
    }

    var items = DB.locMap.get(loc);
    var cnt = items.length;
    var artLine = "";
    if (cnt){
      artLine = '<span class="loc-art' + (cnt > 1 ? ' rot' : '') + '" data-loc="' + esc(loc) + '" data-i="0">' +
        artHtml(items[0]) + '</span>';
    }
    html += '<button class="loc-row' + (loc === activeLoc ? " active" : "") + (SEL[loc] ? " sel" : "") + '" data-loc="' + esc(loc) + '">' +
      '<span class="loc-main"><span class="loc-code">' + (selMode ? ckHtml(!!SEL[loc]) : "") + esc(loc) + '</span>' + artLine + '</span>' +

      (cnt ? '<span class="tag">' + cnt + ' art.</span>' : '<span class="tag empty">libera</span>') +
      '</button>';
  }
  if (n < total){
    html += '<button class="more" id="moreBtn">Mostra altre (' + (total - n) + ' rimaste)</button>';
  }
  $("list").innerHTML = html;
}

$("filters").addEventListener("click", function(e){
  var b = e.target.closest(".chip");
  if (!b) return;
  if (b.getAttribute("data-mode")) fMode = b.getAttribute("data-mode");
  if (b.getAttribute("data-sort")) fSort = b.getAttribute("data-sort");
  if (b.getAttribute("data-par")) fPar = b.getAttribute("data-par");
  shown = 200;
  renderList();
});


function rotateArts(){
  var els = document.querySelectorAll(".loc-art.rot");
  for (var k = 0; k < els.length; k++){
    (function(el){
      var items = DB.locMap.get(el.getAttribute("data-loc"));
      if (!items || items.length < 2) return;
      el.classList.add("fade");
      setTimeout(function(){
        var i = (parseInt(el.getAttribute("data-i"), 10) + 1) % items.length;
        el.setAttribute("data-i", i);
        el.innerHTML = artHtml(items[i]);
        el.classList.remove("fade");
      }, 400);
    })(els[k]);
  }
}

/* ---------- result views ---------- */
var savedScrollY = 0;

function openResult(html){
  if (!document.body.classList.contains("showing")){
    savedScrollY = window.pageYOffset || document.documentElement.scrollTop || 0;
  }
  $("result").innerHTML = html;
  document.body.classList.add("showing");
  window.scrollTo(0, 0);
}
function goBack(){
  document.body.classList.remove("showing");
  window.scrollTo(0, savedScrollY);
}


function showLocation(loc){
  activeLoc = loc;
  var items = DB.locMap.get(loc) || [];
  var html = '<div class="loc-head">' +
    '<button class="back" data-act="back" aria-label="Indietro">' + ic("chevL") + '</button>' +
    '<div class="loc-title"><div class="big-loc">' + esc(loc) + '</div>' +
    '<div class="sub">' + (items.length
      ? items.length + (items.length === 1 ? " articolo" : " articoli")
      : "Libera") + '</div></div>' +
    '<button class="excl-btn" data-act="excl" data-loc="' + esc(loc) + '" aria-label="Escludi ubicazione">' + ic("ban") + '</button>' +
    '</div>';

  if (items.length){
    html += '<table><thead><tr><th>Articolo</th><th>Descrizione</th></tr></thead><tbody>';
    items.forEach(function(r){
      html += '<tr class="clickable" data-art="' + esc(r.articolo) + '"><td class="code">' + esc(r.articolo) +
        '</td><td>' + esc(r.descrizione || "") + '</td></tr>';
    });
    html += '</tbody></table>';
  }
  openResult(html);
  markActive();
}


function showArticle(code){
  var recs = DB.artMap.get(code) || [];
  var desc = recs.length ? (recs[0].descrizione || "") : "";
  var byLoc = new Map();
  recs.forEach(function(r){ byLoc.set(r.ubicazione, true); });
  if (byLoc.size === 1){ showLocation(Array.from(byLoc.keys())[0]); return; }
  var html = '<button class="back" data-act="back">' + ic("chevL") + ' Torna alla lista</button>' +
    '<div class="art-card" style="border-top:0"><h3>' + esc(code) + '</h3><p>' + esc(desc) + '</p>' +
    '<div class="sub" style="padding:0 0 8px">Si trova in ' + byLoc.size + (byLoc.size === 1 ? " ubicazione:" : " ubicazioni:") + '</div>';
  Array.from(byLoc.keys()).sort(natCmp).forEach(function(loc){
    var others = DB.locMap.get(loc).length;
    html += '<button class="loc-btn" data-loc="' + esc(loc) + '">' + esc(loc) +
      '<small>' + others + ' art. qui</small></button>';
  });
  html += '</div>';
  openResult(html);
}


function markActive(){
  var rows = document.querySelectorAll(".loc-row");
  for (var i = 0; i < rows.length; i++){
    rows[i].classList.toggle("active", rows[i].getAttribute("data-loc") === activeLoc);
  }
}

/* ---------- search ---------- */
function runSuggest(){
  var raw = $("q").value.trim();
  $("clr").style.display = $("q").value ? "block" : "none";
  var box = $("sugg");
  if (raw.length < 2){ box.style.display = "none"; sugg = []; return; }

  var qn = raw.toLowerCase();
  var tokens = qn.split(/\s+/).filter(Boolean);
  var qd = noDots(raw);

  /* ubicazioni: punctele din ce scrii si din baza de date sunt ignorate */
  var locHits = [];
  for (var i = 0; i < DB.locs.length; i++){
    var ld = noDots(DB.locs[i]);
    var p = ld.indexOf(qd);
    if (p !== -1) locHits.push({ loc: DB.locs[i], pos: p, exact: (ld === qd) });
  }
  locHits.sort(function(a,b){
    if (a.exact !== b.exact) return a.exact ? -1 : 1;
    return a.pos - b.pos || natCmp(a.loc, b.loc);
  });
  locHits = locHits.slice(0, 8);
  var locFirst = locHits.length > 0 && locHits[0].exact;

  /* articole */
  var artHits = [];
  for (var j = 0; j < DB.artList.length; j++){
    var a = DB.artList[j];
    var hay = (a.code + " " + a.desc).toLowerCase();
    var ok = true;
    for (var t = 0; t < tokens.length; t++){
      if (hay.indexOf(tokens[t]) === -1){ ok = false; break; }
    }
    if (ok){
      var score = a.code.toLowerCase().indexOf(qn) === 0 ? 0 : (a.code.toLowerCase().indexOf(qn) > 0 ? 1 : 2);
      artHits.push({ a: a, score: score });
    }
  }
  artHits.sort(function(x,y){ return x.score - y.score || natCmp(x.a.code, y.a.code); });
  artHits = artHits.slice(0, 15);

  sugg = [];
  var html = "";

  function addLocs(){
    if (!locHits.length) return;
    html += '<div class="sg-h">' + (locFirst ? "Ubicazione rilevata" : "Ubicazioni") + '</div>';
    locHits.forEach(function(h){
      var items = DB.locMap.get(h.loc);
      var cnt = items.length;
      sugg.push({ type: "loc", key: h.loc });
      var line = cnt
        ? '<span class="loc-art' + (cnt > 1 ? ' rot' : '') + '" data-loc="' + esc(h.loc) + '" data-i="0">' + artHtml(items[0]) + '</span>'
        : '';
      var tag = cnt ? '<span class="tag">' + cnt + ' art.</span>' : '<span class="tag empty">libera</span>';
      html += '<button class="sg" data-i="' + (sugg.length - 1) + '"><span class="sg-ico">' + ic("pin") + '</span><span class="sg-body"><b>' + esc(h.loc) + '</b>' + line + '</span>' + tag + '</button>';
    });



  }
  function addArts(){
    if (!artHits.length) return;
    html += '<div class="sg-h">Articoli</div>';
    artHits.forEach(function(h){
      var locs = {};
      DB.artMap.get(h.a.code).forEach(function(r){ locs[r.ubicazione] = 1; });
      var ll = Object.keys(locs).sort(natCmp);
      var hint = ll[0] + (ll.length > 1 ? " +" + (ll.length - 1) : "");
      sugg.push({ type: "art", key: h.a.code });
      html += '<button class="sg" data-i="' + (sugg.length - 1) + '"><span class="sg-body row"><b>' + esc(h.a.code) + '</b><span class="sg-desc">' + esc(h.a.desc) + '</span></span><span class="tag loc">' + esc(hint) + '</span></button>';

    });
  }

  if (locFirst){ addLocs(); addArts(); } else { addArts(); addLocs(); }

  if (!sugg.length) html = '<div class="msg">Nessun risultato</div>';
  box.innerHTML = html;
  box.style.display = "block";
}


function pickSuggestion(i){
  var s = sugg[i];
  if (!s) return;
  $("sugg").style.display = "none";
  $("q").blur();
  if (s.type === "loc") showLocation(s.key); else showArticle(s.key);
}

function pickCol(header, names, fallbackIdx){
  for (var i = 0; i < header.length; i++){
    var h = String(header[i]).trim().toLowerCase();
    if (names.indexOf(h) !== -1) return i;
  }
  return fallbackIdx;
}

async function handleFile(file){
  try {
    setStatus("Lettura del file...", 5);
    var buf = await file.arrayBuffer();
    var wb = XLSX.read(buf, { type: "array" });
    var sheet = wb.Sheets[wb.SheetNames[0]];
    var data = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: "", raw: true });
    if (data.length < 2) throw new Error("Il file non contiene dati.");

    var hd = data[0];
    var cMag = pickCol(hd, ["cod magazzino"], 0);
    var cUb  = pickCol(hd, ["cod ubicazione", "ubicazione"], 1);
    var cArt = pickCol(hd, ["articolo"], 2);
    var cDes = pickCol(hd, ["descrizione"], 3);

    var batch = Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    var ts = new Date().toISOString();
    var rows = [];
    for (var i = 1; i < data.length; i++){
      var r = data[i];
      var ub = String(r[cUb] == null ? "" : r[cUb]).trim();
      if (!ub) continue;
      var art = String(r[cArt] == null ? "" : r[cArt]).trim();
      var des = String(r[cDes] == null ? "" : r[cDes]).trim();
      var mag = String(r[cMag] == null ? "" : r[cMag]).trim();
      rows.push({
        cod_magazzino: mag || null,
        ubicazione: ub,
        articolo: art || null,
        descrizione: des || null,
        batch_id: batch,
        uploaded_at: ts
      });
    }
    if (!rows.length) throw new Error("Nessuna riga valida trovata.");

    setStatus("", 0);
    var okGo = confirm("Il database attuale verra CANCELLATO completamente e sostituito con " + rows.length + " righe dal file '" + file.name + "'. Continuare?");
    if (!okGo) return;

    /* 1. inserimento dati nuovi */
    var chunk = 500;
    try {
      for (var k = 0; k < rows.length; k += chunk){
        var part = rows.slice(k, k + chunk);
        var ins = await sb.from(TABLE).insert(part);
        if (ins.error) throw ins.error;
        setStatus("Caricamento nuovi dati... " + Math.min(k + chunk, rows.length) + " / " + rows.length,
          10 + Math.round(80 * Math.min(k + chunk, rows.length) / rows.length));
      }
    } catch (e1){
      await sb.from(TABLE).delete().eq("batch_id", batch);
      throw e1;
    }

    /* 2. cancellazione dati vecchi */
    setStatus("Cancellazione dati vecchi...", 95);
    var del = await sb.from(TABLE).delete().neq("batch_id", batch);
    if (del.error) throw del.error;

    /* 3. ricaricamento */
    setStatus("Aggiornamento...", 98);
    var fresh = await loadAll();
    buildIndex(fresh);
    shown = 200;
    activeLoc = null;
    $("updTxt").textContent = fmtDate(DB.last);
    $("result").innerHTML = '<div class="placeholder">Scegli un\'ubicazione dalla lista o cerca un articolo.</div>';
    document.body.classList.remove("showing");
    renderList();
    setStatus("Fatto! " + rows.length + " righe caricate.", 100);
    setTimeout(function(){ setStatus("", 0); }, 2500);
  } catch (e){
    setStatus("Errore: " + (e.message || e), 0, true);
    setTimeout(function(){ setStatus("", 0); }, 6000);
  }
}

var RAW = [];
var BUSY = {};
var EXC = [];

function isExcluded(loc){
  var lp = String(loc).toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

  for (var k = 0; k < EXC.length; k++){
    var ru = EXC[k];
    var a = ru.da.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean), b = ru.a.toLowerCase().split(/[^a-z0-9]+/).filter(Boolean);

    if (a.length !== b.length || lp.length !== a.length) continue;
    var vi = -1;
    for (var i = 0; i < a.length; i++){ if (a[i] !== b[i]){ vi = i; break; } }
    var ok = true;
    for (var j = 0; j < a.length; j++){ if (j !== vi && lp[j] !== a[j]) ok = false; }
    if (!ok) continue;
    if (vi === -1) return true;
    if (!/^\d+$/.test(lp[vi]) || !/^\d+$/.test(a[vi]) || !/^\d+$/.test(b[vi])) continue;
    var n = parseInt(lp[vi], 10), lo = parseInt(a[vi], 10), hi = parseInt(b[vi], 10);
    if (lo > hi){ var t = lo; lo = hi; hi = t; }
    if (n < lo || n > hi) continue;
    if (ru.modo === "pari" && n % 2 !== 0) continue;
    if (ru.modo === "dispari" && n % 2 === 0) continue;
    return true;
  }
  return false;
}

async function loadExc(){
  var r = await sb.from("ubicazioni_escluse").select("id,da,a,modo").order("id", { ascending: true });
  if (r.error){ alert("Errore tabella esclusioni: " + r.error.message); EXC = []; }
  else EXC = r.data;

}

function rebuild(){
  buildIndex(RAW);
  activeLoc = null;
  $("result").innerHTML = '<div class="placeholder">Scegli un\'ubicazione dalla lista o cerca un articolo.</div>';
  document.body.classList.remove("showing");
  renderList();
}

function renderExc(){
  var h = "";
  if (!EXC.length) h = '<div class="msg" style="padding:12px">Nessuna esclusione.</div>';
  EXC.forEach(function(r){
    var m = r.modo === "pari" ? "solo pari" : (r.modo === "dispari" ? "solo dispari" : "tutte");
    var saveE = EXC; EXC = [r];
    var seen = {}, hid = 0, names = [];
    RAW.forEach(function(x){
      if (!seen[x.ubicazione]){ seen[x.ubicazione] = 1; if (isExcluded(x.ubicazione) && !BUSY[x.ubicazione]){ hid++; names.push(x.ubicazione); } }
    });
    names.sort(natCmp);

    EXC = saveE;
    h += '<div class="ex-row"><span>' + esc(r.da) + ' ' + ic("arrowR") + ' ' + esc(r.a) +
      '<br><small>' + m + ' | nascoste: ' + hid + '</small>' +
      '<br><small style="color:#b00020">' + esc(names.join(" / ")) + '</small></span><button data-id="' + r.id + '">Elimina</button></div>';


  });
  $("exList").innerHTML = h;
}

var online = true, lastOk = Date.now(), busyHB = false, hiddenAt = 0;

function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_, rej){
    setTimeout(function(){ rej(new Error("timeout")); }, ms);
  })]);
}

async function softRefresh(){
  await loadExc();
  var rows = await loadAll();
  buildIndex(rows);
  renderList();
  $("updTxt").textContent = fmtDate(DB.last);
}

var fails = 0;

async function pingOnce(){
  var ctrl = new AbortController();
  var timer = setTimeout(function(){ ctrl.abort(); }, 10000);
  try {
    var r = await sb.from(TABLE).select("id").limit(1).abortSignal(ctrl.signal);
    if (r.error) throw r.error;
    return true;
  } catch (e){
    return false;
  } finally {
    clearTimeout(timer);
  }
}

async function heartbeat(){
  if (busyHB) return;
  busyHB = true;
  var ok = await pingOnce();
  if (!ok){
    await new Promise(function(res){ setTimeout(res, 1500); });
    ok = await pingOnce();
  }
  if (ok){
    fails = 0;
    lastOk = Date.now();
    if (!online){
      online = true;
      setStatus("Connessione ripristinata", 100);
      try {
        await softRefresh();
        setTimeout(function(){ setStatus("", 0); }, 1500);
      } catch (e){
        online = false;
        setStatus("Connessione persa... riprovo", 0, true);
      }
    }
  } else {
    fails++;
    if (fails >= 2 && online){
      online = false;
      setStatus("Connessione persa... riprovo", 0, true);
    }
  }
  busyHB = false;
}

function hbLoop(){
  heartbeat().then(function(){
    setTimeout(hbLoop, (online && !fails) ? 15000 : 3000);
  });
}

document.addEventListener("visibilitychange", function(){
  if (document.hidden){ hiddenAt = Date.now(); return; }
  heartbeat().then(function(){
    if (online && hiddenAt && Date.now() - hiddenAt > 60000) softRefresh().catch(function(){});
    hiddenAt = 0;
  });
});
window.addEventListener("online", heartbeat);
window.addEventListener("offline", function(){
  online = false;
  setStatus("Connessione persa... riprovo", 0, true);
});

function exportPdf(){
  var list = getFiltered();
  if (!list.length){ alert("Nessuna ubicazione da esportare."); return; }
  if (!window.jspdf || !window.jspdf.jsPDF){
    alert("Libreria PDF non caricata. Controlla la connessione e ricarica la pagina.");
    return;
  }
  setStatus("Creazione PDF...", 50);
  setTimeout(function(){
    try {
      var doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
      var body = [], nArt = 0;

      list.forEach(function(loc){
        var items = DB.locMap.get(loc) || [];
        if (!items.length){
          body.push([
            { content: loc, styles: { fontStyle: "bold" } },
            "",
            { content: "libera", styles: { textColor: [120, 130, 145], fontStyle: "italic" } }
          ]);
          return;
        }
        items.forEach(function(r, idx){
          nArt++;
          var row = [];
          if (idx === 0) row.push({ content: loc, rowSpan: items.length, styles: { fontStyle: "bold", valign: "top" } });
          row.push(r.articolo || "", r.descrizione || "");
          body.push(row);
        });
      });

      var f = [];
      f.push({ all: "Tutte", free: "Libere", busy: "Occupate" }[fMode]);
      if (fPar !== "all") f.push(fPar === "even" ? "Pari" : "Dispari");
      if (fLvl !== "all") f.push("Livello " + fLvl);
      if ($("lq").value.trim()) f.push("Ricerca: " + $("lq").value.trim());
      f.push(fSort === "asc" ? "Ordine crescente" : "Ordine decrescente");

      doc.setFontSize(16);
      doc.setTextColor(27, 36, 48);
      doc.text("Inventario Magazzino", 14, 15);
      doc.setFontSize(9);
      doc.setTextColor(107, 118, 134);
      doc.text("Filtri: " + f.join(" | "), 14, 21);
      doc.text(list.length + " ubicazioni | " + nArt + " articoli | " + new Date().toLocaleDateString("it-IT"), 14, 26);

      doc.autoTable({
        startY: 30,
        head: [["Ubicazione", "Articolo", "Descrizione"]],
        body: body,
        theme: "grid",
        styles: { fontSize: 9, cellPadding: 1.8, lineColor: [221, 227, 236], lineWidth: 0.2, textColor: [27, 36, 48] },
        headStyles: { fillColor: [11, 95, 255], textColor: 255 },
        columnStyles: { 0: { cellWidth: 32 }, 1: { cellWidth: 40 } },
        margin: { left: 14, right: 14, bottom: 14 }
      });

      var pages = doc.internal.getNumberOfPages();
      for (var p = 1; p <= pages; p++){
        doc.setPage(p);
        doc.setFontSize(8);
        doc.setTextColor(107, 118, 134);
        doc.text(p + " / " + pages, 196, 290, { align: "right" });
      }

      doc.save("inventario_" + new Date().toISOString().slice(0, 10) + ".pdf");
      setStatus("PDF creato.", 100);
      setTimeout(function(){ setStatus("", 0); }, 1500);
    } catch (e){
      setStatus("Errore PDF: " + (e.message || e), 0, true);
      setTimeout(function(){ setStatus("", 0); }, 5000);
    }
  }, 50);
}
$("pdfBtn").addEventListener("click", exportPdf);

/* ---------- BLOCCO ESCLUSIONI (stessa password del caricamento) ---------- */
function askUnlock(){
  if (unlocked) return true;
  var pw = prompt("Password per modificare le esclusioni:");
  if (pw === null) return false;
  if (pw !== "kin2026"){
    alert("Password errata.");
    return false;
  }
  unlocked = true;
  return true;
}

document.addEventListener("click", function(e){
  var t = e.target.closest
    ? e.target.closest("#exAdd, #selGo, .excl-btn, #exList button[data-id]")
    : null;
  if (!t) return;
  if (!askUnlock()){
    e.stopPropagation();
    e.preventDefault();
  }
}, true);


/* ---------- CERCA NELLE ESCLUSIONI ---------- */
(function(){
  var inp = document.createElement("input");
  inp.className = "lf";
  inp.id = "exSearch";
  inp.type = "text";
  inp.placeholder = "Cerca nelle ubicazioni escluse (es. A.01.50)";
  inp.setAttribute("autocomplete", "off");
  inp.setAttribute("autocapitalize", "off");
  inp.setAttribute("spellcheck", "false");
  $("exList").parentNode.insertBefore(inp, $("exList"));

  function filterExc(){
    var box = $("exList");
    var q = noDots(inp.value);
    var rows = box.querySelectorAll(".ex-row");
    var old = box.querySelector(".nores");
    if (old) old.remove();
    var n = 0;
    for (var i = 0; i < rows.length; i++){
      var ok = !q || noDots(rows[i].textContent).indexOf(q) !== -1;
      rows[i].style.display = ok ? "" : "none";
      if (ok) n++;
    }
    box.setAttribute("data-count", q ? n + " / " + rows.length : String(rows.length));
    if (rows.length && !n){
      var d = document.createElement("div");
      d.className = "msg nores";
      d.textContent = "Nessun risultato";
      box.appendChild(d);
    }
  }

  var origRender = renderExc;
  renderExc = function(){ origRender(); filterExc(); };

  inp.addEventListener("input", filterExc);
  $("btnExc").addEventListener("click", function(){ inp.value = ""; filterExc(); });
})();

/* ---------- MENIU ESCLUSIONI: carduri + statistici ---------- */
(function(){
  var stats = document.createElement("div");
  stats.id = "exStats";
  stats.innerHTML =
    '<div class="xs-grid">' +
      '<div class="xs"><b id="xsRules">0</b><span>Esclusioni</span></div>' +
      '<div class="xs"><b id="xsHid">0</b><span>Ubicazioni nascoste</span></div>' +
    '</div>' +
    '<div class="xs-title">Nuova esclusione</div>' +
    '<div class="xs-hint">Nascondi un intervallo di ubicazioni. Quelle occupate restano sempre visibili.</div>';
  $("exDa").parentNode.insertBefore(stats, $("exDa"));

  function decorate(){
    var rows = $("exList").querySelectorAll(".ex-row");
    var uniq = {};
    for (var i = 0; i < rows.length; i++){
      var row = rows[i];
      var sp = row.querySelector("span");
      var btn = row.querySelector("button[data-id]");
      if (!sp || !btn) continue;
      var sm = sp.querySelectorAll("small");
      var da = sp.childNodes[0] ? sp.childNodes[0].textContent.trim() : "";
      var a  = sp.childNodes[2] ? sp.childNodes[2].textContent.trim() : "";
      var info = sm[0] ? sm[0].textContent : "";
      var mm = info.match(/^(.*?)\s*\|\s*nascoste:\s*(\d+)/);
      var modo = mm ? mm[1].trim() : "tutte";
      modo = modo.charAt(0).toUpperCase() + modo.slice(1);
      var names = sm[1] ? sm[1].textContent.split(" / ").map(function(s){ return s.trim(); }).filter(Boolean) : [];
      names.forEach(function(n){ uniq[n] = 1; });

      var chipsHtml = "";
      names.slice(0, 80).forEach(function(n){ chipsHtml += '<span class="xc-chip">' + esc(n) + '</span> '; });
      if (names.length > 80) chipsHtml += '<span class="xc-chip more">+' + (names.length - 80) + ' altre</span>';

      row.innerHTML =
        '<div class="xc-body">' +
          '<div class="xc-head"><div class="xc-range"><span>' + esc(da) + '</span>' + ic("arrowR") + '<span>' + esc(a) + '</span></div>' +
          '<span class="xc-badge">' + esc(modo) + '</span></div>' +
          (names.length ? '<div class="xc-chips">' + chipsHtml + '</div>' : '') +
        '</div>' +
        '<div class="xc-foot"><span class="xc-count"><b>' + names.length + '</b> ' + (names.length === 1 ? 'ubicazione nascosta' : 'ubicazioni nascoste') + '</span></div>';
      row.querySelector(".xc-foot").appendChild(btn);
    }
    $("xsRules").textContent = rows.length;
    $("xsHid").textContent = Object.keys(uniq).length;
  }

  var prev = renderExc;
  renderExc = function(){ prev(); decorate(); };

  /* chiudi con Esc o click pe fundal */
  $("excModal").addEventListener("mousedown", function(e){
    if (e.target === this) $("excClose").click();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape" && $("excModal").classList.contains("on")) $("excClose").click();
  });
})();


</script>
